# Thin caller workflow for a publishing repository. Copy this into
# the publishing repo as .github/workflows/seal.yml and adjust the
# content path filter. Two loop-prevention layers work together:
# this trigger ignores the seals directory, and the reusable
# workflow refuses to run on a commit whose message starts with
# "seal:".

name: seal

on:
  push:
    branches: [main]
    paths-ignore:
      - "_seals/**"
  pull_request:
    paths-ignore:
      - "_seals/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  seal:
    uses: niclydon/signet/.github/workflows/seal-reusable.yml@main
    with:
      config: signet.config.json
    secrets:
      SIGNET_SEALING_PRIVATE_KEY: ${{ secrets.SIGNET_SEALING_PRIVATE_KEY }}
